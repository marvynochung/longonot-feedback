<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#648381">
<title>Post-hike feedback</title>
<style>
:root{--slate:#648381;--orange:#f5a520;--card:#f4f5f5;--ink:#111;--mut:#4b5553;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{color:var(--ink);font:18px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;transition:background .3s}
body.s{background:var(--slate)}
body.p{background:var(--card)}
#prog{position:fixed;top:0;left:0;height:6px;width:0;background:var(--orange);transition:width .35s;z-index:5}
.col{max-width:540px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding:28px 24px;padding-top:max(28px,env(safe-area-inset-top));padding-bottom:max(24px,env(safe-area-inset-bottom))}
.fade{animation:in .35s}
@keyframes in{from{opacity:0}to{opacity:1}}
.center{margin:auto 0;text-align:center}
.tile{width:190px;height:190px;margin:0 auto 30px;background:var(--card);border-radius:22px;display:flex;align-items:center;justify-content:center}
.tile img{width:84%;height:84%;object-fit:contain}
.kicker{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;margin:0 0 10px}
h1{font-size:36px;line-height:1.1;margin:0 0 12px}
h2{font-size:27px;line-height:1.2;margin:0 0 10px}
.sub{margin:0 0 26px;font-size:17px}
.small{font-size:14px;margin:14px 0 0}
.top{display:flex;align-items:center;gap:10px;margin-bottom:40px;font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.top img{width:30px;height:30px;object-fit:contain}
.rule{width:44px;height:5px;background:var(--orange);margin:0 0 16px}
.hint{color:var(--mut);margin:0 0 22px;font-size:16px}
.scale{display:flex;gap:10px;margin:8px 0}
.scale button{flex:1;aspect-ratio:1;max-height:76px;font:inherit;font-size:24px;font-weight:700;border:2px solid var(--ink);background:transparent;color:var(--ink);border-radius:8px;cursor:pointer}
.scale button.sel{background:var(--orange)}
.ends{display:flex;justify-content:space-between;color:var(--mut);font-size:14px}
textarea{width:100%;min-height:160px;padding:14px;font:inherit;color:var(--ink);background:#fff;border:2px solid var(--ink);border-radius:8px;resize:vertical}
textarea:focus,button:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.nav{display:flex;gap:12px;align-items:center;margin-top:auto;padding-top:28px}
.btn{width:100%;padding:16px 22px;font:inherit;font-weight:700;border-radius:8px;border:2px solid var(--ink);background:var(--ink);color:var(--card);cursor:pointer;text-decoration:none;text-align:center;display:block}
.btn.link{background:none;border-color:transparent;color:var(--ink);text-decoration:underline;width:auto;flex:0 0 auto;padding:16px 8px}
.btn:disabled{opacity:.3;cursor:default}
.row{display:flex;gap:10px;margin-top:10px}
.row .btn.link{border:2px solid var(--ink);text-decoration:none}
</style>
</head>

<div id="prog"></div>
<div class="col" id="stage"></div>

var P = new URLSearchParams(location.search);
var HIKE = (P.get("hike")||"").replace(/[^\w\s'&-]/g,"").slice(0,40).trim();
var W = HIKE || "the hike";
var QUESTIONS = [
  {id:"overall", type:"rating", q:"How would you rate your overall experience?", lo:"Not great", hi:"Loved it"},
  {id:"enjoyed", type:"text", q:"What did you enjoy most about the hike?", ph:"A view, a moment, a person, anything..."},
  {id:"logistics", type:"text", q:"What worked well, and what could we improve?", hint:"Think about communication, transport, timing and preparation.", ph:"Worked well: ...\nCould improve: ..."},
  {id:"nexttime", type:"text", q:"What should we do differently next time?", ph:"Be as blunt as you like."},
  {id:"difficulty", type:"rating", q:"How difficult was "+W+"?", hint:"1 is easy, 5 is brutal.", lo:"Easy", hi:"Brutal"},
  {id:"aesthetic", type:"rating", q:"How good did "+W+" look?", hint:"1 is meh, 5 is stunning.", lo:"Meh", hi:"Stunning"},
  {id:"review", type:"text", optional:true, q:"Want to leave us a review?", hint:"Optional. A few words we can share is perfect.", ph:"Your review..."}
];
// --------------------
document.title = BRAND+" | Post-hike feedback";
var ans = {}, i = -1, stage = document.getElementById("stage"), prog = document.getElementById("prog");
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function show(html,cls){document.body.className=cls;stage.innerHTML=html}
function render(){
  prog.style.width=Math.max(0,i)/QUESTIONS.length*100+"%";
  if(i<0){
    show('<div class="center fade"><div class="tile"><img src="'+LOGO+'" alt="'+esc(BRAND)+'"></div><p class="kicker">Post-hike feedback</p><h1>How was '+esc(W)+'?</h1><p class="sub">7 quick questions, about 2 minutes.</p><button class="btn" id="go">Start</button><p class="small">Your feedback goes straight to the '+esc(BRAND)+' team.</p></div>',"s");
    document.getElementById("go").onclick=function(){i=0;render()};return;
  }
  if(i>=QUESTIONS.length){return finish()}
  var q=QUESTIONS[i],last=i===QUESTIONS.length-1;
  var h='<div class="fade" style="display:flex;flex-direction:column;flex:1"><div class="top"><img src="'+LOGO+'" alt=""><span>'+esc(BRAND)+'</span></div><p class="kicker" style="color:var(--mut)">Question '+(i+1)+' of '+QUESTIONS.length+(q.optional?' \u00b7 optional':'')+'</p><div class="rule"></div><h2>'+esc(q.q)+'</h2>';
  h+=q.hint?'<p class="hint">'+esc(q.hint)+'</p>':'<div style="height:12px"></div>';
  if(q.type==="rating"){
    h+='<div class="scale">'+[1,2,3,4,5].map(function(n){return '<button data-n="'+n+'" aria-label="'+n+' out of 5">'+n+'</button>'}).join("")+'</div><div class="ends"><span>'+esc(q.lo)+'</span><span>'+esc(q.hi)+'</span></div>';
  } else {
    h+='<textarea id="t" placeholder="'+esc(q.ph||"")+'"></textarea>';
  }
  h+='<div class="nav">'+(i>0?'<button class="btn link" id="back">Back</button>':'')+'<button class="btn" id="next" disabled>'+(last?'Send':'Next')+'</button></div></div>';
  show(h,"p");
  var next=document.getElementById("next");
  function adv(){i++;render()}
  if(q.type==="rating"){
    var btns=stage.querySelectorAll(".scale button");
    btns.forEach(function(b){
      if(ans[q.id]==b.dataset.n){b.classList.add("sel");next.disabled=false}
      b.onclick=function(){btns.forEach(function(x){x.classList.remove("sel")});b.classList.add("sel");ans[q.id]=+b.dataset.n;next.disabled=false;
        if(!last)setTimeout(function(){if(QUESTIONS[i]===q)adv()},280)};
    });
  } else {
    var t=document.getElementById("t");t.value=ans[q.id]||"";
    next.disabled=q.optional?false:!t.value.trim();
    t.oninput=function(){ans[q.id]=t.value;next.disabled=q.optional?false:!t.value.trim()};
    if(window.matchMedia("(pointer:fine)").matches)t.focus();
  }
  next.onclick=adv;
  var back=document.getElementById("back");if(back)back.onclick=function(){i--;render()};
}
function summary(){
  return "Feedback: "+(HIKE||"hike")+"\n\n"+QUESTIONS.map(function(q,n){var a=ans[q.id];return (n+1)+". "+q.q+"\n"+(q.type==="rating"?(a||"-")+"/5":(String(a||"").trim()||"-"))}).join("\n\n");
}
var QKEY="hikeQueue", sending=false;
function getQ(){try{return JSON.parse(localStorage.getItem(QKEY)||"[]")}catch(e){return []}}
function setQ(q){try{localStorage.setItem(QKEY,JSON.stringify(q))}catch(e){}}
async function flush(){
  if(sending||!SUBMIT_URL||!navigator.onLine)return getQ().length;
  sending=true;var q=getQ(),left=[];
  for(var k=0;k<q.length;k++){
    try{
      var r=await fetch(SUBMIT_URL,{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify(q[k])});
      var j=await r.json();if(!j.ok)left.push(q[k]);
    }catch(e){left.push(q[k])}
  }
  setQ(left);sending=false;return left.length;
}
function finish(){
  prog.style.width="100%";
  var head='<div class="center fade"><div class="tile"><img src="'+LOGO+'" alt="'+esc(BRAND)+'"></div><h1>Thank you.</h1>';
  if(P.get("demo")){show(head+'<p class="sub">Your feedback helps us make the next hike better. See you on the trail.</p></div>',"s");return}
  var entry={id:"r"+Date.now()+Math.random().toString(36).slice(2,6),hike:HIKE||"unspecified",at:new Date().toISOString(),answers:ans};
  var q=getQ();q.push(entry);setQ(q);
  var txt=summary(),wa="https://wa.me/"+WHATSAPP+"?text="+encodeURIComponent(txt);
  show(head+'<p class="sub" id="st">Sending...</p><div class="row" id="bk" style="display:none"><a class="btn" href="'+wa+'" target="_blank" rel="noopener">Also send on WhatsApp</a><button class="btn link" id="cp">Copy</button></div></div>',"s");
  var st=document.getElementById("st"),bk=document.getElementById("bk");
  document.getElementById("cp").onclick=function(){var b=this;try{navigator.clipboard.writeText(txt).then(function(){b.textContent="Copied"})}catch(e){}};
  function check(left){
    if(!left){st.textContent="Sent. Thanks for helping us improve the next hike.";bk.style.display="none"}
    else{st.textContent="Saved on your phone. It will send by itself when you have signal and this page is open. To be safe, you can also send it on WhatsApp.";bk.style.display="flex"}
  }
  flush().then(check);
  window.addEventListener("online",function(){flush().then(check)});
}
window.addEventListener("online",flush);
flush();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});
render();
</script>
